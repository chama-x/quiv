name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Typecheck & Index Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck patterns and CLI
        run: bun run typecheck
      - name: Validate Knowledge Index
        run: bun run check-index
      - name: Run CLI Test Suite
        run: bun run test
