<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quiv_grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="quiv_glow" x="0" y="0" width="128" height="128" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shell -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  
  <!-- Inner Brand Hex / Vault Block -->
  <rect x="20" y="20" width="88" height="88" rx="20" fill="url(#quiv_grad)"/>
  
  <!-- 3 Layered Architecture Primitives (Knowledge Tiers) -->
  <rect x="36" y="38" width="56" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="36" y="54" width="42" height="8" rx="4" fill="#93C5FD"/>
  <circle cx="86" cy="58" r="4" fill="#60A5FA"/>
  <rect x="36" y="70" width="56" height="8" rx="4" fill="#FFFFFF"/>
  <rect x="36" y="86" width="28" height="8" rx="4" fill="#93C5FD"/>
