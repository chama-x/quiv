<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="flow_bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="glow_line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00FF87"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#flow_bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="19" stroke="#1E293B" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="45" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.1em">HOW AGENTS INTERFACE WITH QUIV</text>

  <!-- Flow Steps -->
  <!-- Step 1: Agent Request -->
  <g transform="translate(50, 75)">
    <rect width="240" height="145" rx="12" fill="#0B1324" stroke="#3B82F6" stroke-opacity="0.4"/>
    <text x="20" y="35" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">01. INTENT</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="800">Agent Needs Pattern</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Claude / Cursor initiates feature buildout.</text>
    <text x="20" y="125" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">"offline sync queue"</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M305 145H335M330 140L335 145L330 150" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Step 2: Semantic Find -->
  <g transform="translate(350, 75)">
    <rect width="240" height="145" rx="12" fill="#061B24" stroke="#00F0FF" stroke-opacity="0.4"/>
    <text x="20" y="35" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">02. DISCOVERY</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="800">quiv find (12ms)</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Fast semantic lookup across 5 capability tiers.</text>
    <text x="20" y="125" fill="#00F0FF" font-family="'JetBrains Mono', monospace" font-size="11">140 tokens consumed</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M605 145H635M630 140L635 145L630 150" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Step 3: Progressive Disclosure -->
  <g transform="translate(650, 75)">
    <rect width="240" height="145" rx="12" fill="#140F2B" stroke="#A855F7" stroke-opacity="0.4"/>
    <text x="20" y="35" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">03. PROGRESSIVE READ</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="800">Overview / Contract</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Agent pulls type contracts &amp; invariants only.</text>
    <text x="20" y="125" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11">240 tokens total</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M905 145H935M930 140L935 145L930 150" stroke="#00FF87" stroke-width="2" stroke-linecap="round"/>

  <!-- Step 4: Scaffold & Lore -->
  <g transform="translate(950, 75)">
    <rect width="200" height="145" rx="12" fill="#071F18" stroke="#00FF87" stroke-opacity="0.4"/>
    <text x="20" y="35" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">04. SCAFFOLD</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="800">quiv use</text>
    <text x="20" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Scaffolded in project with Lore trailers.</text>
    <text x="20" y="125" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">0% Hallucinations</text>
  </g>
</svg>
