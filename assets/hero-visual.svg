<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#18181b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Card -->
  <rect width="880" height="360" fill="url(#bg)" rx="16"/>
  <rect x="0.5" y="0.5" width="879" height="359" rx="15.5" stroke="#27272a" stroke-width="1"/>

  <!-- Accent Pill -->
  <rect x="56" y="44" width="48" height="5" fill="#22c55e" rx="2.5"/>

  <!-- Title & Subtitle -->
  <text x="56" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#fafafa" letter-spacing="-2">quiv</text>
  <text x="56" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#a1a1aa" font-weight="600">The Context Engine for AI Coding Agents</text>

  <!-- Divider -->
  <line x1="56" y1="168" x2="824" y2="168" stroke="#27272a" stroke-width="1.5"/>

  <!-- WITHOUT QUIV BAR -->
  <g transform="translate(56, 190)">
    <text x="0" y="16" font-family="SF Mono, Monaco, 'Cascadia Code', monospace" font-size="14" fill="#ef4444" font-weight="800" letter-spacing="2">WITHOUT QUIV</text>
    <rect x="0" y="26" width="630" height="30" fill="#ef4444" rx="6" opacity="0.9"/>
    <text x="768" y="48" font-family="SF Mono, Monaco, monospace" font-size="18" fill="#ef4444" text-anchor="end" font-weight="800">8,200 tokens</text>
  </g>

  <!-- WITH QUIV BAR -->
  <g transform="translate(56, 268)">
    <text x="0" y="16" font-family="SF Mono, Monaco, 'Cascadia Code', monospace" font-size="14" fill="#22c55e" font-weight="800" letter-spacing="2">WITH QUIV</text>
    <rect x="0" y="26" width="22" height="30" fill="#22c55e" rx="6"/>
    <text x="34" y="48" font-family="SF Mono, Monaco, monospace" font-size="18" fill="#22c55e" font-weight="800">140 tokens</text>
    <text x="768" y="48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="34" fill="#22c55e" text-anchor="end" font-weight="900">−98%</text>
  </g>
</svg>
