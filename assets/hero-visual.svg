<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hero_bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="purple_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="red_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF416C"/>
      <stop offset="100%" stop-color="#8A0027"/>
    </linearGradient>
    <linearGradient id="green_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>
    <filter id="glow_cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow_red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="24" fill="url(#hero_bg)"/>
  <rect x="1" y="1" width="1198" height="518" rx="23" stroke="#1E293B" stroke-width="2"/>

  <!-- Subtle Cyberpunk Grid -->
  <g opacity="0.15">
    <path d="M0 65H1200M0 130H1200M0 195H1200M0 260H1200M0 325H1200M0 390H1200M0 455H1200" stroke="#334155" stroke-width="1"/>
    <path d="M120 0V520M240 0V520M360 0V520M480 0V520M600 0V520M720 0V520M840 0V520M960 0V520M1080 0V520" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="150" cy="180" r="120" fill="#EF4444" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="1050" cy="180" r="140" fill="#00FF87" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="600" cy="240" r="160" fill="#00F0FF" fill-opacity="0.09" filter="blur(70px)"/>

  <!-- BRAND HEADER / TITLE AREA -->
  <g transform="translate(60, 45)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="30" rx="15" fill="#0F172A" stroke="#00F0FF" stroke-opacity="0.4"/>
    <circle cx="14" cy="15" r="4" fill="#00F0FF"/>
    <text x="26" y="19" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">2026 AGENT KNOWLEDGE PROTOCOL</text>

    <!-- Main Title -->
    <text x="0" y="75" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.04em">quiv</text>
    <text x="115" y="75" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="400" letter-spacing="-0.02em"> — Stop Burning Context.</text>
  </g>

  <!-- SIDE-BY-SIDE VISUAL CONTRAST (LOUD MINIMALISM) -->

  <!-- LEFT CARD: THE OLD WAY (CHAOS & CONTEXT EXPLOSION) -->
  <g transform="translate(60, 160)">
    <rect width="420" height="300" rx="18" fill="#0F141F" stroke="#331A24" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="42" rx="18" fill="#1A1017"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#331A24"/>
    <circle cx="56" cy="21" r="5" fill="#331A24"/>
    <text x="75" y="25" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">WITHOUT QUIV (THE CONTEXT TRAP)</text>

    <!-- Stat Callout -->
    <text x="28" y="85" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="900">32,400</text>
    <text x="155" y="75" fill="#F87171" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700">TOKENS WASTED</text>
    <text x="155" y="93" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">Per Feature Session</text>

    <!-- Chaos Rows -->
    <g transform="translate(28, 120)">
      <rect width="364" height="36" rx="8" fill="#1C131A"/>
      <text x="14" y="22" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="12">⚠️ 12,000t: Full Codebase Grep Dump</text>
      
      <rect y="46" width="364" height="36" rx="8" fill="#1C131A"/>
      <text x="14" y="68" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="12">⚠️  8,500t: Hallucinated Duplicate Types</text>

      <rect y="92" width="364" height="36" rx="8" fill="#1C131A"/>
      <text x="14" y="114" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="12">❌ Agent Forgets System Invariants</text>
    </g>

    <text x="28" y="278" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Result: Reasoning breakdown &amp; $40/day API bills</text>
  </g>

  <!-- CENTER LIGHTNING COMPRESSION FUNNEL -->
  <g transform="translate(510, 240)">
    <!-- Funnel / Transformation Pillar -->
    <rect x="0" y="0" width="180" height="140" rx="14" fill="#0A1124" stroke="#00F0FF" stroke-width="2" filter="url(#glow_cyan)"/>
    <text x="90" y="38" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="0.06em">PROGRESSIVE</text>
    <text x="90" y="56" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="0.06em">DISCLOSURE</text>

    <!-- Big Lightning Metric -->
    <text x="90" y="96" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="900">32.5×</text>
    <text x="90" y="118" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">COMPRESSION</text>

    <!-- Arrow Indicators -->
    <path d="M-20 70L-5 70" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M185 70L200 70" stroke="#00FF87" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- RIGHT CARD: THE QUIV WAY (PRECISION & 10X SPEED) -->
  <g transform="translate(720, 160)">
    <rect width="420" height="300" rx="18" fill="#071318" stroke="#064E3B" stroke-width="2"/>
    <rect x="0" y="0" width="420" height="42" rx="18" fill="#06231E"/>
    <circle cx="24" cy="21" r="5" fill="#00FF87"/>
    <circle cx="40" cy="21" r="5" fill="#064E3B"/>
    <circle cx="56" cy="21" r="5" fill="#064E3B"/>
    <text x="75" y="25" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">WITH QUIV (SURGICAL EFFICIENCY)</text>

    <!-- Stat Callout -->
    <text x="28" y="85" fill="#00FF87" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="900">240</text>
    <text x="110" y="75" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="700">TOKENS ONLY</text>
    <text x="110" y="93" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12">100% Architectural Precision</text>

    <!-- Precision Rows -->
    <g transform="translate(28, 120)">
      <rect width="364" height="36" rx="8" fill="#092921"/>
      <text x="14" y="22" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="12">⚡  140t: `quiv find` semantic match</text>
      
      <rect y="46" width="364" height="36" rx="8" fill="#092921"/>
      <text x="14" y="68" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="12">⚡  100t: Pure contracts &amp; Lore trailers</text>

      <rect y="92" width="364" height="36" rx="8" fill="#092921"/>
      <text x="14" y="114" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="12">✅ 100% Strict Types &amp; Zero Regressions</text>
    </g>

    <text x="28" y="278" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="600">Result: 12ms latency &amp; razor-sharp reasoning</text>
  </g>
</svg>
