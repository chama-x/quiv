<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stat_bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="cyan_text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>
    <linearGradient id="purple_text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="blue_text" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="240" rx="20" fill="url(#stat_bg)"/>
  <rect x="1" y="1" width="1198" height="238" rx="19" stroke="#1E293B" stroke-width="2"/>

  <!-- Stat Card 1 -->
  <g transform="translate(50, 40)">
    <rect width="340" height="160" rx="14" fill="#0A111C" stroke="#00F0FF" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="30" y="70" fill="url(#cyan_text)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-0.03em">32.5×</text>
    <text x="30" y="105" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">Token Compression</text>
    <text x="30" y="130" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">240 tokens vs. 7,800 tokens raw context</text>
  </g>

  <!-- Stat Card 2 -->
  <g transform="translate(430, 40)">
    <rect width="340" height="160" rx="14" fill="#0A111C" stroke="#A855F7" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="30" y="70" fill="url(#purple_text)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-0.03em">&lt; 12ms</text>
    <text x="30" y="105" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">CLI Discovery Latency</text>
    <text x="30" y="130" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">Sub-millisecond AST &amp; keyword scanner</text>
  </g>

  <!-- Stat Card 3 -->
  <g transform="translate(810, 40)">
    <rect width="340" height="160" rx="14" fill="#0A111C" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="30" y="70" fill="url(#blue_text)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-0.03em">100%</text>
    <text x="30" y="105" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700">Deterministic Invariants</text>
    <text x="30" y="130" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13">Zero hallucinated architecture regressions</text>
  </g>
</svg>
