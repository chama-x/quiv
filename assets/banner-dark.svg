  <text x="265" y="80" fill="#58A6FF" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600">v1.0.0 (BUN &amp; TS NATIVE)</text>
  
  <!-- Subtitle -->
  <text x="80" y="152" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="22" font-weight="600">The Agent Knowledge Kit &amp; Architecture System</text>
  <text x="80" y="184" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" font-size="16" font-weight="400">10–32x token-efficient architecture discovery &amp; progressive disclosure for AI coding agents</text>

  <!-- Terminal Preview Box -->
  <g transform="translate(730, 45)">
