    <circle cx="52" cy="18" r="5" fill="#61C554"/>
    <text x="75" y="22" fill="#6E7681" font-family="'JetBrains Mono', monospace" font-size="11">quiv-cli — agent-discovery</text>
    
    <!-- Code / CLI lines -->
    <text x="20" y="60" fill="#58A6FF" font-family="'JetBrains Mono', monospace" font-size="13">$ bunx quiv find "offline sync"</text>
    <text x="20" y="88" fill="#3FB950" font-family="'JetBrains Mono', monospace" font-size="13">✔ Found 3 patterns (240 tokens)</text>
    <text x="20" y="116" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="12">  • features/offline-sync [PROVEN|v2.0]</text>
    <text x="20" y="138" fill="#8B949E" font-family="'JetBrains Mono', monospace" font-size="12">  • primitives/storage-kv [PROVEN|v1.0]</text>
    
    <text x="20" y="176" fill="#58A6FF" font-family="'JetBrains Mono', monospace" font-size="13">$ quiv use features/offline-sync</text>
    <text x="20" y="204" fill="#3FB950" font-family="'JetBrains Mono', monospace" font-size="13">✔ Scaffolded &amp; indexed in 14ms</text>
