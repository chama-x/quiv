<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="340" rx="16" fill="#F6F8FA"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" stroke="#D0D7DE"/>
  
