    <circle cx="20" cy="18" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="18" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="18" r="5" fill="#27C93F"/>
    <text x="75" y="22" fill="#57606A" font-family="'JetBrains Mono', monospace" font-size="11">quiv-cli — agent-discovery</text>
    
    <!-- Code / CLI lines -->
    <text x="20" y="60" fill="#0969DA" font-family="'JetBrains Mono', monospace" font-size="13">$ bunx quiv find "offline sync"</text>
    <text x="20" y="88" fill="#1A7F37" font-family="'JetBrains Mono', monospace" font-size="13">✔ Found 3 patterns (240 tokens)</text>
    <text x="20" y="116" fill="#57606A" font-family="'JetBrains Mono', monospace" font-size="12">  • features/offline-sync [PROVEN|v2.0]</text>
    <text x="20" y="138" fill="#57606A" font-family="'JetBrains Mono', monospace" font-size="12">  • primitives/storage-kv [PROVEN|v1.0]</text>
    
    <text x="20" y="176" fill="#0969DA" font-family="'JetBrains Mono', monospace" font-size="13">$ quiv use features/offline-sync</text>
    <text x="20" y="204" fill="#1A7F37" font-family="'JetBrains Mono', monospace" font-size="13">✔ Scaffolded &amp; indexed in 14ms</text>
    <text x="20" y="226" fill="#9A6700" font-family="'JetBrains Mono', monospace" font-size="12">⚡ Saved 7,960 context tokens</text>
