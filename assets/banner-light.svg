  <path d="M0 68H1200M0 136H1200M0 204H1200M0 272H1200" stroke="#EAEEF2" stroke-width="1"/>
  <path d="M150 0V340M300 0V340M450 0V340M600 0V340M750 0V340M900 0V340M1050 0V340" stroke="#EAEEF2" stroke-width="1"/>

