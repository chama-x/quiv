name: Update Index

on:
  push:
    branches: [main]
    paths:
      - 'primitives/**'
      - 'domain/**'
      - 'features/**'
      - 'compositions/**'
      - 'templates/**'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: |
          node scripts/update-index.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(index): auto-update INDEX.md catalog tables" && git push)
